services:
  claude:
    # Опубликованный образ окружения агента: собирает и проверяет его пайплайн репозитория
    # kit'а, проект получает готовый образ из реестра. Секции сборки здесь нет — исходник
    # образа в поставку не входит, и описание сборки ссылалось бы на отсутствующий файл.
    #
    # Имя, тег и digest вынесены в переменные: закрепить конкретную версию или состав, подставить
    # свою сборку можно в .env, не редактируя этот файл, — правка пережила бы не всякую
    # переустановку kit'а.
    #
    # Тег переставляет каждая пересборка, поэтому побайтовую неизменность образа даёт только
    # digest: SDD_KIT_IMAGE_DIGEST дописывается к ссылке и, будучи заданным, определяет образ
    # независимо от тега. Разделитель @ входит в значение переменной, а не в эту строку: пустая
    # переменная иначе оставила бы в ссылке висящий разделитель.
    image: ${SDD_KIT_IMAGE:-ghcr.io/united-software-platform/sdd-developer-kit}:${SDD_KIT_IMAGE_TAG:-latest}${SDD_KIT_IMAGE_DIGEST:-}
    # Отдельный compose-профиль: `docker compose up` сервисов окружения агента не поднимает
    profiles: ["claude"]
    # Команда по умолчанию — сам агент; аргумент после имени сервиса её заменяет (bash, git, …)
    command: claude
    working_dir: ${PROJECT_DIR:-/app}
    env_file: .env
    # Имя хоста для раннера целей make: на Linux host.docker.internal сам не резолвится
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Консолидирует весь конфиг (.claude.json, .credentials.json)
      # в смонтированный каталог аккаунта, иначе авторизация слетает
      CLAUDE_CONFIG_DIR: ${CLAUDE_CONFIG_DIR:-/home/claude/.claude}

    volumes:
      - .:${PROJECT_DIR:-/app}                                             # рабочее дерево проекта
      # Профиль задаёт каталог аккаунта: он берётся из .env или из переменной окружения
      # команды запуска сессии. Значение по умолчанию намеренно указывает на несуществующий
      # подкаталог: без профиля путь схлопнулся бы в каталог всех аккаунтов и агент увидел бы
      # чужие профили — вместо этого он получает пустой каталог конфигурации
      - ${CLAUDE_ACCOUNTS_DIR:-.claude-accounts}/${CLAUDE_PROFILE:-__no_profile__}:${CLAUDE_CONFIG_DIR:-/home/claude/.claude}
      - ${PROJECT_DIR:-/app}/${CLAUDE_ACCOUNTS_DIR:-.claude-accounts}      # анонимный том прячет чужие профили внутри контейнера
      - ${SSH_DIR:-.ssh}:${CONTAINER_SSH_DIR:-/home/claude/.ssh}           # ключи для работы с репозиторием
      # Файл секретов скрыт от агента: значения приезжают через env_file,
      # сам .env внутри контейнера пустой. compose читает его на хосте — маскировка не мешает
      - /dev/null:${PROJECT_DIR:-/app}/.env:ro

  # Тулчейн сборки и проверки Go. Отдельный сервис, потому что в контейнере агента нет ни go,
  # ни make, ни docker: без него критерий готовности этапа — «сборка и линтер чисты» —
  # проверить неоткуда. Образ несёт и компилятор, и линтер, поэтому сервис один.
  #
  # Сервис одноразовый: цели Makefile вызывают его через `docker compose run --rm`, и работающим
  # он не остаётся. Отсюда restart: "no" — исключение из DOCK-007, разрешённое DOCK-014.
  extruder-build:
    image: ${EXTRUDER_BUILD_IMAGE:-golangci/golangci-lint}:${EXTRUDER_BUILD_IMAGE_TAG:-v1.62-alpine}
    container_name: extruder-build
    # Отдельный compose-профиль: `docker compose up` тулчейн не поднимает
    profiles: ["build"]
    restart: "no"
    working_dir: ${PROJECT_DIR:-/app}
    # Команда приходит от цели Makefile строкой: одна точка входа на build, lint и test
    entrypoint: ["/bin/sh", "-c"]
    # Сборка идёт от пользователя хоста, иначе артефакты в смонтированном дереве
    # достаются root и рабочее дерево становится недоступным на запись [DOCK-012]
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      # Кэши живут в смонтированном дереве, а не в домашнем каталоге и не в именованном томе:
      # домашнего каталога у произвольного uid в образе нет, а именованный том создаётся
      # принадлежащим root — сервис под uid хоста писать в него не смог бы. Каталог .gocache/
      # принадлежит пользователю хоста и потому доступен на запись; из git он исключён.
      GOCACHE: ${PROJECT_DIR:-/app}/.gocache/build
      GOMODCACHE: ${PROJECT_DIR:-/app}/.gocache/mod
      # Домашний каталог нужен линтеру: без него он пытается писать кэш в корень образа
      # и падает на правах. Значение указывает туда же, в доступный на запись .gocache/
      HOME: ${PROJECT_DIR:-/app}/.gocache
      GOLANGCI_LINT_CACHE: ${PROJECT_DIR:-/app}/.gocache/lint
      # Тулчейн не вызывает git: каталог .git принадлежит другому пользователю,
      # и штатная проверка владельца репозитория оборвала бы сборку
      GOFLAGS: -buildvcs=false
    volumes:
      - .:${PROJECT_DIR:-/app}          # то же рабочее дерево, что видит агент
    networks:
      - extruder-net

networks:
  extruder-net:
    driver: bridge
