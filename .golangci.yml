# Конфигурация линтера Go. Набор правил задаётся здесь, а не ключами вызова:
# цель `make lint` и прогон разработчика должны давать один и тот же вердикт.
run:
  timeout: 3m

linters:
  enable:
    - errcheck      # необработанная ошибка — молчаливый отказ
    - govet         # подозрительные конструкции
    - ineffassign   # присваивание, которое никто не читает
    - staticcheck   # общий набор проверок корректности
    - unused        # неиспользуемый код
    - revive        # стиль и именование
    - gofmt         # форматирование

issues:
  exclude-use-default: false
